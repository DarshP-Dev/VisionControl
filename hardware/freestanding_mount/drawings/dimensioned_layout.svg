ont-size="17">Fork inner spacing: 108</text><text x="650" y="420" font-size="17">Passive pivot: Ø5 shoulder / Ø8 bushing</text><text x="650" y="455" font-size="17">Pan journal: Ø39.5 in Ø40</text><text x="650" y="490" font-size="17">Pan deck Ø116 × 4; underside Z76</text><text x="650" y="525" font-size="17">Pan ±60°; tilt ±35° target only</text><text x="650" y="560" font-size="17">Body height includes clip; lens datum unmeasured</text><text x="45" y="765" font-size="15">Origin: base bottom; +X right, +Y forward, +Z up. Feet add 4 mm desk clearance.</text><text x="45" y="788" font-size="15">Actual geometry and all movement clearances require FreeCAD execution plus physical interface checks.</text><text x="45" y="811" font-size="15">Camera mounting hole is DISABLED. Never force a provisional screw into the insert.</text></g></svg>
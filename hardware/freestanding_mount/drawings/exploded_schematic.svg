<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#f8fafc"/><g font-family="Arial" fill="#172b42"><text x="45" y="45" font-size="26">Exploded assembly sequence | schematic</text><text x="45" y="75" font-size="15">PRELIMINARY SCHEMATIC — mm — NOT A FREECAD RENDER — NOT TO SCALE</text><path d="M360,110 L360,735" fill="none" stroke="#526579" stroke-width="1.5"/><rect x="180" y="130" width="360" height="60" fill="#dce1e7" stroke="#263e53" stroke-width="2"/><text x="640" y="138" font-size="20">Camera + existing folding clip</text><text x="640" y="162" font-size="14">Owner hardware; insert unverified</text><rect x="170" y="225" width="380" height="18" fill="#c2daca" stroke="#263e53" stroke-width="2"/><text x="640" y="233" font-size="20">CameraPlate</text><text x="640" y="257" font-size="14">4 × M3 flush-head bolts to cradle</text><rect x="150" y="315" width="420" height="25" fill="#7fae9b" stroke="#263e53" stroke-width="2"/><text x="640" y="323" font-size="20">Cradle + horn adapter</text><text x="640" y="347" font-size="14">Opposite pivot + stock servo horn</text><rect x="120" y="400" width="480" height="25" fill="#578caf" stroke="#263e53" stroke-width="2"/><text x="640" y="408" font-size="20">LeftFork / RightFork</text><text x="640" y="432" font-size="14">2 × M3 each to rotor; tilt servo on right</text><rect x="115" y="485" width="490" height="18" fill="#578caf" stroke="#263e53" stroke-width="2"/><text x="640" y="493" font-size="20">PanRotor + stock horn</text><text x="640" y="517" font-size="14">PTFE thrust washer; supported journal</text><rect x="225" y="555" width="270" height="65" fill="#c8d6e0" stroke="#263e53" stroke-width="2"/><text x="640" y="563" font-size="20">Pedestal + pan servo</text><text x="640" y="587" font-size="14">Install servo before attaching to base</text><rect x="130" y="675" width="460" height="28" fill="#96b5cc" stroke="#263e53" stroke-width="2"/><text x="640" y="683" font-size="20">Base + captive nuts + ballast</text><text x="640" y="707" font-size="14">Cover below; rubber feet clear cover</text><text x="45" y="765" font-size="15">Stock horns provide the splined interface. Printed adapters bolt to horns; no printed spline coupling.</text><text x="45" y="788" font-size="15">Pan thrust washer carries gravity load. Opposite tilt bushing supports the camera cradle.</text><text x="45" y="811" font-size="15">Rendered exploded FCStd/PNG is generated only when generate_freecad.build() runs successfully.</text></g></svg>